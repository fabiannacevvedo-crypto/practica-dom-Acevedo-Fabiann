<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería de Superhéroes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="container py-4">

  <h1 class="text-center mb-4">Galería de Superhéroes</h1>

  <!-- Filtro -->
  <div class="mb-3">
    <input type="text" id="filtroNombre" class="form-control" placeholder="Filtrar por nombre">
    <button id="btnFiltrar" class="btn btn-primary mt-2">Filtrar</button>
  </div>

  <!-- Contenedor de cards -->
  <div id="galeria" class="row"></div>

  <!-- Formulario -->
  <h2 class="mt-4">Agregar personaje</h2>
  <form id="formAgregar" class="mb-4">
    <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre" required>
    <input type="url" id="imagen" class="form-control mb-2" placeholder="URL de la imagen" required>
    <button type="submit" class="btn btn-success">Agregar</button>
  </form>

  <script src="js/app.js"></script>
</body>
</html>
